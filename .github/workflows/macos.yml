# Builds the macOS app (universal: Apple Silicon and Intel): the .dmg and
# the update package, attached to the run as the "Ropeway-macos" artifact.
name: macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Assembler for OpenH264's optimized x86_64 code.
      - run: brew install nasm

      - run: npm ci

      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      # The update package is the app in a tarball; it is signed later on
      # the maintainer's computer (scripts/release.py), the key is not here.
      - name: Name the files for the release
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          b=target/universal-apple-darwin/release/bundle
          mkdir -p out
          cp "$b"/dmg/*.dmg "out/Ropeway-$version-macos-universal.dmg"
          tar -czf "out/Ropeway-$version-macos-universal.app.tar.gz" -C "$b/macos" Ropeway.app

      - uses: actions/upload-artifact@v4
        with:
          name: Ropeway-macos
          path: out/*
          if-no-files-found: error
